<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e4e1d8">
  <!-- Add to Home Screen opens it like an app, with no browser bars (the only full screen iPhone allows) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habit">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Habit</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Yuji+Syuku&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #cfcabd; overflow: hidden; touch-action: none; }
    canvas { display: block; margin: 0 auto; }
    #rotate { display: none; position: fixed; inset: 0; background: #e4e1d8; color: #16130f;
      font: 400 24px "Yuji Syuku", "Shippori Mincho", serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="rotate">Turn your phone sideways to play, or tap here.</div>
  <script type="module">
    import { start } from './src/game.js';
    start(document.getElementById('game'));
  </script>
</body>
</html>
